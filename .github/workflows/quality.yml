name: Quality and security checks

on:
  push:
    branches: [main, "security/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-and-js:
    name: PHP and JavaScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' -not -path './vendor/*')
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php tests/auth-input.php
          php tests/admin-catalog-input.php
          php tests/media-url.php
          php tests/commerce-input.php
          php tests/payment-config.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check storefront JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/admin.js

      - name: Check patch whitespace
        run: git diff --check

  tenant-isolation-mysql:
    name: MySQL schema and tenant-isolation integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: supermarket360
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Apply fresh schema and demo seed
        run: |
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/schema.sql
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/demo-seed.sql

      - name: Apply tenant isolation migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_tenant_isolation.sql

      - name: Run cross-tenant negative tests
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/tenant-isolation.sql

      - name: Apply authentication migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_auth_sessions_otp.sql

      - name: Run authentication schema tests
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/auth-schema.sql

      - name: Apply permissions migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_permissions.sql

      - name: Run permission scope tests
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/permissions.sql

      - name: Set up PHP for HTTP API tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Create public API smoke fixtures
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/api-smoke-fixtures.sql

      - name: Run tenant-aware HTTP API smoke tests
        env:
          APP_ENV: testing
          APP_KEY: ci-test-secret-with-more-than-thirty-two-characters
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          MEDIA_BASE_URL: https://cdn.example.test/assets
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 tests/php-router.php >/tmp/supermarket-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          bash tests/api-smoke.sh
