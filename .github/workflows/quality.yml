name: Quality and security checks

on:
  push:
    branches: [main, "security/**", "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-and-js:
    name: PHP and JavaScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.php' -not -path './vendor/*')
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            php -l "$file"
          done
          php tests/env-file.php
          php tests/auth-input.php
          php tests/admin-catalog-input.php
          php tests/media-url.php
          php tests/media-orphan-input.php
          php tests/commerce-input.php
          php tests/payment-config.php
          php tests/sms-provider-config.php
          php tests/wallet-input.php
          php tests/report-csv.php

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check storefront JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/admin.js
          node --check assets/js/analytics-consent.js
          node --check assets/js/staff.js
          node --check assets/js/platform.js
          node --check assets/js/subscription.js
          node --check assets/js/notifications.js
          node --check assets/js/pos.js
          node --check assets/js/pos-receipt.js
          node --check assets/js/pos-refunds.js

      - name: Check patch whitespace
        run: git diff --check


  mariadb-compatibility:
    name: MariaDB 10.11 schema and migration compatibility
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: supermarket360
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: Verify schema and all ordered migrations on MariaDB
        run: bash tests/mariadb-migrations.sh

  tenant-isolation-mysql:
    name: MySQL schema and tenant-isolation integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: supermarket360
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Apply fresh schema and demo seed
        run: |
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/schema.sql
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/demo-seed.sql

      - name: Apply tenant isolation migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_tenant_isolation.sql

      - name: Run cross-tenant negative tests
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/tenant-isolation.sql

      - name: Apply authentication migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_auth_sessions_otp.sql

      - name: Clear unverified pending registration profile data
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_20_pending_registration_profile.sql

      - name: Run authentication schema tests
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/auth-schema.sql

      - name: Apply permissions migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_permissions.sql

      - name: Apply owner-only platform payment settings migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_platform_payment_settings.sql

      - name: Verify platform payment settings defaults and permission scope
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/platform-payment-settings.sql

      - name: Apply SaaS plans and subscription billing migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_19_platform_subscriptions.sql

      - name: Verify SaaS billing schema and tenant isolation
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/platform-billing.sql

      - name: Apply subscription plan change migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_19_subscription_plan_changes.sql

      - name: Apply order picker and courier assignment migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_order_assignments.sql
      - name: Apply customer pickup handoff migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_pickup_handoff.sql
      - name: Verify customer pickup handoff schema
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/pickup-handoff.sql

      - name: Apply in-app notifications migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_notifications.sql

      - name: Apply notification retention index migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_19_notification_retention_index.sql

      - name: Apply courier delivery tracking migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_order_delivery_tracking.sql

      - name: Verify courier delivery tracking schema and tenant constraints
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/order-delivery-tracking.sql

      - name: Apply order wallet refund migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_order_wallet_refunds.sql

      - name: Apply DNS TXT domain verification migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_domain_verification_challenge.sql

      - name: Run permission scope tests
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/permissions.sql

      - name: Test tenant-safe order assignments
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/order-assignments.sql

      - name: Apply persistent customer cart migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_customer_carts.sql

      - name: Apply customer address management migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_customer_address_management.sql

      - name: Apply barcode and low-stock threshold migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_barcode_stock_thresholds.sql

      - name: Test tenant barcode uniqueness and stock thresholds
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/barcode-stock.sql

      - name: Apply media cleanup queue migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_media_cleanup_queue.sql

      - name: Apply platform SMS settings migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_20_platform_sms_settings.sql

      - name: Verify platform SMS settings schema
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/platform-sms-settings.sql

      - name: Apply operator-reviewed orphan media migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_20_media_orphan_reviews.sql
      - name: Verify operator-reviewed orphan media schema and permission
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/media-orphan-reviews.sql

      - name: Apply delivery zones migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_delivery_zones.sql

      - name: Apply pickup slot migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_pickup_slots.sql

      - name: Apply coupon migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_coupons.sql

      - name: Apply product variants migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_product_variants.sql

      - name: Apply supplier purchase orders migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_supplier_purchase_orders.sql

      - name: Apply supplier returns migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_supplier_returns.sql

      - name: Apply stock batches migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_stock_batches.sql

      - name: Apply POS cash register migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_pos_cash_register.sql

      - name: Apply POS refund ledger migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_06_pos_refunds.sql
      - name: Apply POS returned-item inspection migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_08_pos_return_inspection.sql
      - name: Apply POS refund inspection status migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_08_pos_return_inspection_status.sql

      - name: Verify POS cash register and refund schema
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/pos-cash-register.sql

      - name: Apply expired stock write-off migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_expired_stock_writeoff.sql

      - name: Apply merchant SEO content fields migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_seo_content_fields.sql

      - name: Apply stable product SEO slugs migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_product_seo_slugs.sql

      - name: Apply SEO URL redirect history migration
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/migrations/2026_11_05_seo_url_redirects.sql

      - name: Test stock batch reservation integrity
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/stock-batches.sql



      - name: Test initial store owner bootstrap
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/bootstrap-store-owner.sql

      - name: Set up PHP for HTTP API tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Verify read-only media storage reconciliation
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          MEDIA_STORAGE_PATH: /tmp/supermarket-media-reconcile
        run: |
          set -euo pipefail
          mkdir -p /tmp/supermarket-media-reconcile/tenant-1/product
          printf 'known' > /tmp/supermarket-media-reconcile/tenant-1/product/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.jpg
          printf 'orphan' > /tmp/supermarket-media-reconcile/tenant-1/product/cccccccccccccccccccccccccccccccccccccccc.webp
          printf 'queued' > /tmp/supermarket-media-reconcile/tenant-1/product/dddddddddddddddddddddddddddddddddddddddd.png
          ln -s /etc/hosts /tmp/supermarket-media-reconcile/tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "INSERT INTO media_assets (tenant_id,media_type,storage_key,alt_text) VALUES (1,'product','tenant-1/product/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.jpg','known'),(1,'product','tenant-1/product/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb.jpg','missing'); INSERT INTO media_cleanup_queue (tenant_id,storage_key,status,attempts) VALUES (1,'tenant-1/product/dddddddddddddddddddddddddddddddddddddddd.png','pending',0);"
          set +e
          php scripts/reconcile-media.php >/tmp/media-reconcile-report.json
          status=$?
          set -e
          cat /tmp/media-reconcile-report.json
          echo "Media reconciliation exit code: $status"
          test "$status" -eq 2
          php -r '$r=json_decode(file_get_contents("/tmp/media-reconcile-report.json"),true,512,JSON_THROW_ON_ERROR); if (($r["status"]??"")!=="attention_required" || ($r["counts"]["registered_files"]??-1)!==1 || ($r["counts"]["queued_cleanup_files"]??-1)!==1 || ($r["counts"]["orphan_files"]??-1)!==1 || ($r["counts"]["missing_registered_files"]??-1)!==1 || ($r["counts"]["unsafe_entries"]??-1)!==1) { fwrite(STDERR,"Unexpected media reconciliation report\n"); exit(1); }'
          test -f /tmp/supermarket-media-reconcile/tenant-1/product/cccccccccccccccccccccccccccccccccccccccc.webp
          test -L /tmp/supermarket-media-reconcile/tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM media_cleanup_queue WHERE tenant_id=1 AND storage_key='tenant-1/product/cccccccccccccccccccccccccccccccccccccccc.webp'" | grep -qx '0'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM media_cleanup_queue WHERE tenant_id=1 AND storage_key='tenant-1/product/dddddddddddddddddddddddddddddddddddddddd.png' AND status='pending'" | grep -qx '1'
          rm -rf /tmp/supermarket-media-reconcile
          mkdir -p /tmp/supermarket-media-reconcile
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "DELETE FROM media_assets WHERE tenant_id=1 AND storage_key LIKE 'tenant-1/product/%'; DELETE FROM media_cleanup_queue WHERE tenant_id=1 AND storage_key LIKE 'tenant-1/product/%';"
          php scripts/reconcile-media.php >/tmp/media-reconcile-clean.json
          php -r '$r=json_decode(file_get_contents("/tmp/media-reconcile-clean.json"),true,512,JSON_THROW_ON_ERROR); if (($r["status"]??"")!=="ok" || ($r["counts"]["files_scanned"]??-1)!==0) { fwrite(STDERR,"Clean media reconciliation did not return an empty healthy report\n"); exit(1); }'

      - name: Verify combined media operations alerts and non-destructive behavior
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          MEDIA_STORAGE_PATH: /tmp/supermarket-media-ops
        run: |
          set -euo pipefail
          mkdir -p /tmp/supermarket-media-ops/tenant-1/product
          printf 'orphan' > /tmp/supermarket-media-ops/tenant-1/product/cccccccccccccccccccccccccccccccccccccccc.webp
          ln -s /etc/hosts /tmp/supermarket-media-ops/tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "INSERT INTO media_cleanup_queue (tenant_id,storage_key,status,attempts) VALUES (1,'tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg','pending',0);"
          set +e
          php scripts/media-operations-check.php >/tmp/media-operations-alert.json
          status=$?
          set -e
          test "$status" -eq 2
          php -r '$r=json_decode(file_get_contents("/tmp/media-operations-alert.json"),true,512,JSON_THROW_ON_ERROR); $codes=array_column($r["alerts"]??[],"code"); if (($r["status"]??"")!=="attention_required" || !in_array("cleanup_queue_backlog",$codes,true) || !in_array("media_reconciliation_attention_required",$codes,true) || ($r["cleanup"]["pending_total"]??0)!==1 || ($r["reconciliation"]["orphan_files"]??0)!==1 || ($r["reconciliation"]["unsafe_entries"]??0)!==1) { fwrite(STDERR,"Combined media operations alert report was incomplete\n"); exit(1); } if (str_contains(file_get_contents("/tmp/media-operations-alert.json"),"tenant-1/")) { fwrite(STDERR,"Alert report leaked a storage key\n"); exit(1); }'
          test -f /tmp/supermarket-media-ops/tenant-1/product/cccccccccccccccccccccccccccccccccccccccc.webp
          test -L /tmp/supermarket-media-ops/tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM media_cleanup_queue WHERE tenant_id=1 AND storage_key='tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg' AND status='pending'" | grep -qx '1'
          rm -rf /tmp/supermarket-media-ops
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "DELETE FROM media_cleanup_queue WHERE tenant_id=1 AND storage_key='tenant-1/product/eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee.jpg'"

      - name: Verify bounded notification retention
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          NOTIFICATION_READ_RETENTION_DAYS: "180"
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 <<'SQL'
          SET @user_one=(SELECT id FROM users WHERE tenant_id=1 AND mobile='09120000001' LIMIT 1);
          SET @user_two=(SELECT id FROM users WHERE tenant_id=2 AND mobile='09120000002' LIMIT 1);
          INSERT INTO notifications (tenant_id,user_id,event_key,notification_type,title,body,created_at,read_at)
          VALUES
            (1,@user_one,'ci-old-read-one','system','Old read','Retention fixture',DATE_SUB(UTC_TIMESTAMP(),INTERVAL 200 DAY),DATE_SUB(UTC_TIMESTAMP(),INTERVAL 190 DAY)),
            (1,@user_one,'ci-old-unread','system','Old unread','Must remain',DATE_SUB(UTC_TIMESTAMP(),INTERVAL 200 DAY),NULL),
            (1,@user_one,'ci-recent-read','system','Recent read','Must remain',DATE_SUB(UTC_TIMESTAMP(),INTERVAL 5 DAY),DATE_SUB(UTC_TIMESTAMP(),INTERVAL 1 DAY)),
            (2,@user_two,'ci-old-read-two','system','Other tenant old read','Tenant scoped row',DATE_SUB(UTC_TIMESTAMP(),INTERVAL 200 DAY),DATE_SUB(UTC_TIMESTAMP(),INTERVAL 190 DAY));
          SQL
          php bin/prune-notifications.php >/tmp/notification-prune.json
          php -r '$r=json_decode(file_get_contents("/tmp/notification-prune.json"),true,512,JSON_THROW_ON_ERROR); if (($r["status"]??"")!=="ok" || ($r["deleted"]??-1)!==2 || ($r["retention_days"]??-1)!==180) { fwrite(STDERR,"Unexpected notification retention report\\n"); exit(1); }'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM notifications WHERE event_key IN ('ci-old-read-one','ci-old-read-two')" | grep -qx '0'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM notifications WHERE event_key IN ('ci-old-unread','ci-recent-read')" | grep -qx '2'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "DELETE FROM notifications WHERE event_key LIKE 'ci-%'"

      - name: Verify bounded media cleanup retention
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          MEDIA_CLEANUP_RETENTION_DAYS: "180"
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 <<'SQL'
          INSERT INTO media_cleanup_queue (tenant_id,storage_key,status,attempts,created_at,processed_at)
          VALUES
            (1,'tenant-1/product/1111111111111111111111111111111111111111.jpg','completed',1,DATE_SUB(UTC_TIMESTAMP(),INTERVAL 220 DAY),DATE_SUB(UTC_TIMESTAMP(),INTERVAL 200 DAY)),
            (1,'tenant-1/product/2222222222222222222222222222222222222222.jpg','completed',1,DATE_SUB(UTC_TIMESTAMP(),INTERVAL 10 DAY),DATE_SUB(UTC_TIMESTAMP(),INTERVAL 5 DAY)),
            (1,'tenant-1/product/3333333333333333333333333333333333333333.jpg','pending',0,DATE_SUB(UTC_TIMESTAMP(),INTERVAL 220 DAY),NULL);
          SQL
          php bin/prune-media-cleanup.php >/tmp/media-cleanup-prune.json
          php -r '$r=json_decode(file_get_contents("/tmp/media-cleanup-prune.json"),true,512,JSON_THROW_ON_ERROR); if (($r["status"]??"")!=="ok" || ($r["deleted"]??-1)!==1 || ($r["retention_days"]??-1)!==180) { fwrite(STDERR,"Unexpected media cleanup retention report\\n"); exit(1); }'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM media_cleanup_queue WHERE storage_key LIKE 'tenant-1/product/%' AND status='completed'" | grep -qx '1'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -N -e "SELECT COUNT(*) FROM media_cleanup_queue WHERE storage_key='tenant-1/product/3333333333333333333333333333333333333333.jpg' AND status='pending'" | grep -qx '1'
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "DELETE FROM media_cleanup_queue WHERE tenant_id=1 AND storage_key LIKE 'tenant-1/product/%'"

      - name: Create public API smoke fixtures
        run: mysql --host=127.0.0.1 --user=root --password=root supermarket360 < database/tests/api-smoke-fixtures.sql

      - name: Verify SaaS renewal invoice and grace-period worker
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: ci-test-secret-with-more-than-thirty-two-characters
        run: bash tests/subscription-billing-worker.sh

      - name: Run tenant-aware HTTP API smoke tests
        env:
          APP_ENV: testing
          APP_KEY: ci-test-secret-with-more-than-thirty-two-characters
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          MEDIA_BASE_URL: https://cdn.example.test/assets
          MEDIA_STORAGE_PATH: /tmp/supermarket-media
          TEST_DOMAIN_VERIFICATION_HOST: ci-platform-store.example.test
          TEST_DOMAIN_VERIFICATION_TOKEN: ci-only-domain-proof-2026
        run: |
          set -euo pipefail
          mkdir -p /tmp/supermarket-media
          PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:8099 tests/php-router.php >/tmp/supermarket-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          bash tests/api-smoke.sh
          REFERRAL_REWARD_BASIS_POINTS=500 php tests/wallet-referral-integration.php

      - name: Run tenant-aware SEO page smoke tests
        env:
          APP_ENV: testing
          APP_KEY: ci-test-secret-with-more-than-thirty-two-characters
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          MEDIA_BASE_URL: https://cdn.example.test/assets
          MEDIA_STORAGE_PATH: /tmp/supermarket-media
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8100 -t . tests/seo-router.php >/tmp/supermarket-seo.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Host: localhost" http://127.0.0.1:8100/index.php >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS -H "Host: localhost" http://127.0.0.1:8100/index.php >/dev/null
          bash tests/seo-smoke.sh

      - name: Seed encrypted gateway settings for preflight
        env:
          APP_ENV: production
          APP_KEY: ci-production-preflight-secret-with-more-than-32-characters
          APP_BASE_URL: https://store.example.test
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: root
          DB_PASSWORD: root
          ZARINPAL_MERCHANT_ID: ci-placeholder-merchant-id
        run: php tests/seed-ci-payment-settings.php

      - name: Run read-only production deployment preflight
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_KEY: ci-production-preflight-secret-with-more-than-32-characters
          APP_BASE_URL: https://store.example.test
          DB_HOST: 127.0.0.1
          DB_DATABASE: supermarket360
          DB_USERNAME: preflight
          DB_PASSWORD: preflight-test-password
          SMS_PROVIDER: kavenegar
          KAVENEGAR_API_KEY: ci-placeholder-api-key
          KAVENEGAR_VERIFY_TEMPLATE: ci-placeholder-template
          ZARINPAL_MERCHANT_ID: ci-placeholder-merchant-id
          ZARINPAL_SANDBOX: "false"
          MEDIA_BASE_URL: https://cdn.example.test/assets
          MEDIA_STORAGE_PATH: /tmp/supermarket-preflight-media
        run: |
          set -euo pipefail
          mysql --host=127.0.0.1 --user=root --password=root supermarket360 -e "CREATE USER IF NOT EXISTS 'preflight'@'%' IDENTIFIED BY 'preflight-test-password'; GRANT SELECT ON supermarket360.* TO 'preflight'@'%';"
          mkdir -p /tmp/supermarket-preflight-media
          php bin/production-preflight.php
